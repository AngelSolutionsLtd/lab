<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,400italic,700,700italic%7cOpen+Sans+Condensed:300,700">
<style>
    /* Override the entypo @font-face declared in the Perspective external stylesheet
       to use our locally-served copy, avoiding intermittent CORS errors from their server.
       Being declared after the external link, this takes precedence in modern browsers. */
    @font-face {
        font-family: 'entypo';
        src:
            url('/fonts/entypo.ttf?76kg9z') format('truetype'),
            url('/fonts/entypo.woff?76kg9z') format('woff'),
            url('/fonts/entypo.svg?76kg9z#entypo') format('svg');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
    }
</style>
<style>
    .ai-button {
        border: none;
        display: inline-flex;
        padding: 2px 0.4em;
        justify-content: center;
        align-items: center;
        border-radius: 4px;
        background: linear-gradient(94deg, #40C9FF -74.46%, #E81CFF 114.83%);
        transition: all .2s cubic-bezier(0.215, 0.610, 0.355, 1);
    }
    .ai-button:hover, .isGenerating {
        box-shadow: 0px 4px 4px 0px rgba(215, 164, 253, 0.30), 0px 2px 8px 0px rgba(0, 0, 0, 0.25) inset;
    }
    .spinner {
        animation: spin 1s linear infinite;
        display: inline-block;
    }

    @keyframes spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .side-drawer--no-overlay {
        content: none !important;
    }
    .page-width {
        margin: 0 auto;
        max-width: 1300px;
        width: 95%;
    }
    
    @keyframes icon-shake {
        5.333%   { transform: translateY(-2px); animation-timing-function: ease-in; }
        14.333%  { transform: translateY(-0.7px); animation-timing-function: ease-in; }
        10%, 19% { transform: none; }
    }

    @keyframes icon-tilt {
        5.333%   { transform: rotate(20deg) translate(2px, -3px) scale(1.1); animation-timing-function: ease-in; }
        14.333%  { transform: rotate(7deg) translate(0.7px, -1px) scale(1.035); animation-timing-function: ease-in; }
        10%, 19% { transform: none; }
    }

    .icon-shake,
    .icon-tilt {
        display: inline-block;
        will-change: transform;
    }

    .icon-shake {
        animation: icon-shake 3s ease-out 3;
    }

    .icon-tilt {
        animation: icon-tilt 3s ease-out 3;
    }

    @media (prefers-reduced-motion: reduce) {
        .icon-shake,
        .icon-tilt {
            animation: none !important;
        }
    }
</style>
